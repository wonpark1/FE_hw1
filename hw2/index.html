<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Instagram Card</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- 인스타 카드 시작 -->
    <div class="card">
      <div class="card__header">
        <div class="card__user">
          <img src="profile.png" alt="profile" />
          <span>qkr.won</span>
        </div>
        <i class="fas fa-ellipsis-h"></i>
      </div>

      <img class="card__post-img" src="image.png" alt="post" />
      <div class="card__insight">
        <a href="#">인사이트 보기</a>
      </div>

      <div class="card__actions">
        <div class="left">
          <div class="'icon-wrap">
            <i class="far fa-heart"></i>
            <span class="count">3000</span>
          </div>

          <div class="icon-wrap">
            <i class="far fa-comment"></i>
            <span class="count">2</span>
          </div>
          <i class="far fa-paper-plane"></i>
          <i class="fas fa-retweet"></i>
        </div>
        <i class="far fa-bookmark"></i>
      </div>

      <div class="card__content">
        <div class="card__likes">asdjf님 외 여러명이 좋아합니다</div>
      </div>
      <!-- 댓글 목록 -->
      <div class="card__comments">
        <div class="card__comment">
          <span><strong>potato03</strong> 🎁</span>
          <i class="far fa-heart comment-like"></i>
        </div>
        <div class="card__comment">
          <span><strong>apple01</strong> 😆</span>
          <i class="far fa-heart comment-like"></i>
        </div>
        <div class="card__comment">
          <span><strong>strawberry02</strong> 굿~</span>
          <i class="far fa-heart comment-like"></i>
        </div>
      </div>

      <div class="card__date">4월 28일</div>
    </div>
  </body>
</html>
